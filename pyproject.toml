[project]
name = "krisha-fair-price"
version = "0.1.0"
description = "ML-сервис справедливой цены квартир в Алматы по данным Krisha.kz"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "catboost>=1.2",
    "h3>=4.0",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "shap>=0.45",
    "matplotlib>=3.8",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
