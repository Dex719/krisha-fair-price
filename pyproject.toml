[project]
name = "krisha-fair-price"
version = "0.5.0"
description = "ML-сервис справедливой цены квартир в Алматы по данным Krisha.kz"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "catboost>=1.2",
    "h3>=4.0",
    "scipy>=1.11",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "cryptography>=42.0",  # шифрование state-файлов с chat_id (публичный репо)
]

[project.optional-dependencies]
train = [
    "shap>=0.45",
    "matplotlib>=3.8",
    "scikit-learn>=1.4",
]

dev = [
    "shap>=0.45",
    "matplotlib>=3.8",
    "scikit-learn>=1.4",
    "pytest>=8.0",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# B (bugbear) ловит реальные баги: мутабельные дефолты, поздний биндинг в лямбдах и т.п.
select = ["E", "F", "I", "W", "B"]
# B905 (zip strict=) — осознанно выключено: пришлось бы дописать strict=False
# в 11 мест без выигрыша; включим, если появятся zip'ы разной длины.
ignore = ["E501", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# CI/local invoke plain `pytest` (not `python -m pytest`), which does not
# add the repo root to sys.path on its own — tests/test_runtime_lock.py
# imports the non-package `scripts/` dir, so it needs the root explicit.
pythonpath = ["."]
