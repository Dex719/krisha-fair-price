<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Krisha Fair Price — справедливая цена квартиры</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght@8..144,100..125,300..900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/m3.css" />
  <link rel="icon" type="image/png" href="/static/avatar.png?v=3" />
  <script src="/static/icons.js"></script>
  <script>
    // до отрисовки — чтобы не мигала тема
    document.documentElement.dataset.theme =
      localStorage.getItem("kfp-theme") ||
      (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  </script>
</head>
<body>
  <div class="blobs" aria-hidden="true">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>

  <div class="page page-narrow">
    <header class="top-bar reveal">
      <a class="brand" href="/">
        <span class="logo"><img src="/static/avatar.png?v=3" alt="Krisha Fair Price" /></span>
        Krisha Fair Price
      </a>
      <div class="spacer"></div>
      <a class="btn btn-tonal" href="/stats" style="padding:11px 18px;font-size:.92rem">
        <span data-icon="chart" data-icon-size="20"></span>
        Рынок Алматы
      </a>
      <button id="theme-toggle" class="icon-btn" type="button" aria-label="Переключить тему">
        <span id="theme-icon"></span>
      </button>
    </header>

    <section style="padding:7vh 0 36px" class="reveal">
      <h1 class="display">Сколько эта квартира стоит <span class="accent">на самом деле?</span></h1>
      <p class="body-lg" style="max-width:540px;margin-top:18px">
        Вставь ссылку на объявление с Krisha.kz — модель, обученная на
        <b>7&nbsp;000+ квартирах Алматы</b>, оценит справедливую цену и покажет, что на неё влияет.
      </p>
    </section>

    <form id="form" class="search-bar reveal" autocomplete="off">
      <button type="button" id="paste-btn" class="paste-btn" aria-label="Вставить ссылку из буфера обмена" title="Вставить из буфера">
        <span data-icon="link" data-icon-size="22"></span>
      </button>
      <input id="url" type="url" required placeholder="https://krisha.kz/a/show/…" aria-label="Ссылка на объявление" />
      <button id="btn" type="submit" class="btn btn-filled">
        <span id="btn-icon" data-icon="sparkles" data-icon-size="20"></span>
        <span id="btn-text">Оценить</span>
      </button>
    </form>

    <div id="loading" class="card" style="display:none;margin-top:24px">
      <div class="skeleton" style="height:18px;width:55%"></div>
      <div class="skeleton" style="height:38px;width:75%;margin-top:14px"></div>
      <div class="skeleton" style="height:14px;width:100%;margin-top:18px"></div>
      <div class="skeleton" style="height:14px;width:88%;margin-top:10px"></div>
    </div>

    <section id="result" style="display:none;margin-top:24px"></section>

    <div id="error" class="card pop-in" role="alert"
         style="display:none;margin-top:24px;background:var(--error-container);color:var(--on-error-container)"></div>

    <footer class="colophon reveal">
      CatBoost · MAPE 10.6% · R² 0.78 — учебный проект, не финансовый совет
    </footer>
  </div>

  <script>
    /* ---------- тема ---------- */
    const themeIcon = document.getElementById("theme-icon");
    const syncIcon = () =>
      themeIcon.innerHTML = kfpIcon(document.documentElement.dataset.theme === "dark" ? "sun" : "moon");
    syncIcon();
    document.getElementById("theme-toggle").addEventListener("click", () => {
      const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
      document.documentElement.dataset.theme = next;
      localStorage.setItem("kfp-theme", next);
      syncIcon();
    });

    /* ---------- появление при загрузке ---------- */
    document.querySelectorAll(".reveal").forEach((el, i) =>
      setTimeout(() => el.classList.add("in"), 80 + i * 110));

    /* ---------- словари ---------- */
    const FEATURE_NAMES = {
      area: "Площадь", rooms: "Комнаты", floor: "Этаж", total_floors: "Этажность",
      floor_ratio: "Положение по этажам", is_first_floor: "Первый этаж", is_last_floor: "Последний этаж",
      year_built: "Год постройки", building_age: "Возраст дома", ceiling: "Потолки",
      lat: "Широта", lon: "Долгота", dist_center_km: "Расстояние до центра",
      district: "Район", microdistrict: "Микрорайон", building_type: "Тип дома",
      complex_name: "Жилой комплекс", user_type: "Продавец", category: "Категория",
      photos_count: "Кол-во фото", district_median_ppsm: "Уровень цен района",
      micro_median_ppsm: "Уровень цен микрорайона", is_new_building: "Новостройка",
      district_ppsm: "Уровень цен района", microdistrict_ppsm: "Уровень цен микрорайона",
      renovation: "Ремонт", toilet: "Санузел", furniture: "Мебель", parking: "Парковка",
      balcony: "Балкон", has_security_guard: "Охрана", has_intercom: "Домофон",
      has_video_surveillance: "Видеонаблюдение", security_count: "Опции безопасности",
      housing_class: "Класс жилья", developer: "Застройщик",
      completion_year: "Год сдачи ЖК", apartments_count: "Размер ЖК",
      dist_metro_km: "Близость метро", dist_school_km: "Близость школы",
      dist_kindergarten_km: "Близость детсада", dist_park_km: "Близость парка",
      dist_supermarket_km: "Близость супермаркета", dist_bus_stop_km: "Близость остановки",
      dist_big_road_km: "Близость магистрали", dist_industrial_km: "Близость промзоны",
      walk_score: "Пешая доступность",
    };
    const VERDICTS = {
      GOOD_DEAL: { label: "Выгодно!", icon: "trending-down", cls: "chip-good" },
      FAIR: { label: "Справедливая цена", icon: "check-circle", cls: "chip-fair" },
      OVERPRICED: { label: "Переплата", icon: "flame", cls: "chip-bad" },
    };
    const fmt = (n) => new Intl.NumberFormat("ru-RU").format(Math.round(n)) + " ₸";

    /* бейдж сделки: «ниже рынка на 8%» / «выше рынка на 12%» / «в рынке» */
    /* этап 4: блок «Рынок» — история цены, дни на рынке, ликвидность */
    function marketBlock(data) {
      const hist = data.price_history || [];
      const rows = [];
      if (hist.length > 1) {
        const first = hist[0].price, last = hist[hist.length - 1].price;
        const drop = ((last - first) / first * 100).toFixed(1).replace(/\.0$/, "").replace("-", "−");
        rows.push({ label: "Цена менялась", value: `${hist.length - 1} раз (${last > first ? "+" : ""}${drop}% от старта)` });
        hist.slice(-4).forEach((p) => {
          rows.push({ label: p.observed_at.slice(0, 10), value: fmt(p.price) });
        });
      }
      if (data.days_on_market != null && data.days_on_market > 0)
        rows.push({ label: "Дней на рынке", value: data.days_on_market });
      if (data.liquidity)
        rows.push({ label: "Похожие продаются за", value: `~${data.liquidity.median_days} дн.` });
      if (!rows.length) return "";
      return `
          <p class="title" style="display:flex;align-items:center;gap:10px;margin:22px 0 12px;font-size:.95rem">
            <span style="color:var(--secondary)">${kfpIcon("chart", 20)}</span>Рынок
          </p>
          <div class="details-grid">
            ${rows.map((d) => `
              <div class="detail-item">
                <p class="d-label">${d.label}</p>
                <p class="d-value">${d.value}</p>
              </div>`).join("")}
          </div>`;
    }

    const diffBadge = (pct) => {
      const abs = Math.abs(pct).toFixed(1).replace(/\.0$/, "");
      if (pct <= -1) return `ниже рынка на ${abs}%`;
      if (pct >= 1) return `выше рынка на ${abs}%`;
      return "в рынке";
    };

    /* ---------- анимация чисел ---------- */
    function countUp(el, target, suffix) {
      const dur = 900, t0 = performance.now();
      const ease = (t) => 1 - Math.pow(1 - t, 3);
      (function tick(now) {
        const p = Math.min((now - t0) / dur, 1);
        el.textContent = new Intl.NumberFormat("ru-RU").format(Math.round(target * ease(p))) + suffix;
        if (p < 1) requestAnimationFrame(tick);
      })(t0);
    }

    /* ---------- карточка объявления: фото + характеристики ---------- */
    function listingCard(data) {
      const photos = data.photos || [], details = data.details || [];
      if (!photos.length && !details.length && !data.description) return "";
      return `
        <div class="card card-elevated pop-in" style="padding:28px;margin-top:18px">
          <p class="title" style="display:flex;align-items:center;gap:10px;margin:0 0 16px">
            <span style="color:var(--primary)">${kfpIcon("photo", 22)}</span>О квартире
          </p>
          ${photos.length ? `
          <div class="gallery" id="gallery">
            <img class="main" id="g-main" src="${photos[0]}" alt="Фото квартиры" loading="lazy" />
            ${photos.length > 1 ? `
            <button class="gallery-nav prev" type="button" data-dir="-1" aria-label="Назад">${kfpIcon("chevron-left", 22)}</button>
            <button class="gallery-nav next" type="button" data-dir="1" aria-label="Вперёд">${kfpIcon("chevron-right", 22)}</button>
            <span class="gallery-count" id="g-count">1 / ${photos.length}</span>` : ""}
          </div>
          ${photos.length > 1 ? `
          <div class="thumbs" id="g-thumbs">
            ${photos.map((src, i) => `<img src="${src}" data-i="${i}" class="${i === 0 ? "active" : ""}" alt="" loading="lazy" />`).join("")}
          </div>` : ""}` : ""}
          ${details.length ? `
          <p class="title" style="display:flex;align-items:center;gap:10px;margin:${photos.length ? "22px" : "0"} 0 12px;font-size:.95rem">
            <span style="color:var(--secondary)">${kfpIcon("list", 20)}</span>Характеристики
          </p>
          <div class="details-grid">
            ${details.map((d) => `
              <div class="detail-item">
                <p class="d-label">${d.label}</p>
                <p class="d-value">${d.value}</p>
              </div>`).join("")}
          </div>` : ""}
          ${(data.complex_details || []).length ? `
          <p class="title" style="display:flex;align-items:center;gap:10px;margin:22px 0 12px;font-size:.95rem">
            <span style="color:var(--secondary)">${kfpIcon("building", 20)}</span>О доме
          </p>
          <div class="details-grid">
            ${data.complex_details.map((d) => `
              <div class="detail-item">
                <p class="d-label">${d.label}</p>
                <p class="d-value">${d.value}</p>
              </div>`).join("")}
          </div>` : ""}
          ${(data.location_details || []).length ? `
          <p class="title" style="display:flex;align-items:center;gap:10px;margin:22px 0 12px;font-size:.95rem">
            <span style="color:var(--secondary)">${kfpIcon("map-pin", 20)}</span>Локация
          </p>
          <div class="details-grid">
            ${data.location_details.map((d) => `
              <div class="detail-item">
                <p class="d-label">${d.label}</p>
                <p class="d-value">${d.value}</p>
              </div>`).join("")}
          </div>` : ""}
          ${marketBlock(data)}
          ${data.description ? `
          <p class="title" style="margin:22px 0 4px;font-size:.95rem">Описание</p>
          <p class="listing-desc" id="g-desc"></p>
          <button class="desc-toggle" id="g-desc-toggle" type="button">Показать полностью</button>` : ""}
        </div>`;
    }

    function initListingCard(data) {
      const photos = data.photos || [];
      if (photos.length > 1) {
        let cur = 0;
        const main = document.getElementById("g-main"),
              count = document.getElementById("g-count"),
              thumbs = document.getElementById("g-thumbs");
        const show = (i) => {
          cur = (i + photos.length) % photos.length;
          main.src = photos[cur];
          count.textContent = `${cur + 1} / ${photos.length}`;
          thumbs.querySelectorAll("img").forEach((t) => t.classList.toggle("active", +t.dataset.i === cur));
          thumbs.querySelectorAll("img")[cur].scrollIntoView({ behavior: "smooth", block: "nearest", inline: "nearest" });
        };
        document.querySelectorAll("#gallery .gallery-nav").forEach((b) =>
          b.addEventListener("click", () => show(cur + +b.dataset.dir)));
        thumbs.addEventListener("click", (e) => {
          if (e.target.dataset.i != null) show(+e.target.dataset.i);
        });
      }
      if (data.description) {
        const desc = document.getElementById("g-desc"), toggle = document.getElementById("g-desc-toggle");
        desc.textContent = data.description; // textContent — без HTML-инъекций
        toggle.addEventListener("click", () => {
          const open = desc.classList.toggle("open");
          toggle.textContent = open ? "Свернуть" : "Показать полностью";
        });
        // если описание короткое и не обрезается — кнопка не нужна
        requestAnimationFrame(() => {
          if (desc.scrollHeight <= desc.clientHeight + 4) toggle.style.display = "none";
        });
      }
    }

    /* ---------- рендер результата ---------- */
    function render(data) {
      const v = VERDICTS[data.verdict] || { label: "Хм…", icon: "help", cls: "chip-fair" };
      const hasActual = data.actual_price != null;
      // шкала: справедливая зона ±10% вокруг fair_price
      const lo = data.fair_price * 0.7, hi = data.fair_price * 1.3;
      const pos = (x) => Math.min(98, Math.max(2, ((x - lo) / (hi - lo)) * 100));
      const maxImpact = Math.max(...data.top_factors.map(f => Math.abs(f.impact)), 1e-9);

      const result = document.getElementById("result");
      result.innerHTML = `
        <div class="card card-elevated pop-in" style="padding:28px">
          <p class="label" style="margin:0 0 12px">${data.title || "Объявление"}${data.address ? " · " + data.address : ""}</p>
          <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:22px">
            <span class="chip ${v.cls}">${kfpIcon(v.icon, 20)}${v.label}</span>
            ${data.diff_pct != null ? `<span class="body-lg" style="margin:0">${diffBadge(data.diff_pct)}</span>` : ""}
          </div>

          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:24px">
            <div class="card" style="background:var(--surface-container-high);padding:18px">
              <p class="label" style="margin:0">Цена в объявлении</p>
              <p id="num-actual" class="headline" style="margin-top:6px">${hasActual ? "" : "—"}</p>
            </div>
            <div class="card card-hero" style="padding:18px">
              <p class="label" style="margin:0;color:inherit;opacity:.75">Справедливая цена</p>
              <p id="num-fair" class="headline" style="margin-top:6px"></p>
            </div>
          </div>

          ${hasActual ? `
          <p class="label" style="margin:0 0 10px">Где цена объявления на шкале</p>
          <div class="meter" style="margin-bottom:4px">
            <div class="zone" style="left:${pos(data.fair_price * 0.9)}%;right:${100 - pos(data.fair_price * 1.1)}%"></div>
            <div class="needle" id="needle" style="left:2%"></div>
          </div>
          <div class="meter-labels label">
            <span>${fmt(lo)}</span>
            <span style="color:var(--primary);font-weight:700">справедливо: ${fmt(data.fair_price)}</span>
            <span>${fmt(hi)}</span>
          </div>` : ""}

          <p class="title" style="margin:26px 0 10px">Что влияет на цену</p>
          ${data.top_factors.map((f, i) => `
            <div class="factor">
              <span>${FEATURE_NAMES[f.feature] || f.feature}</span>
              <span class="impact ${f.impact > 0 ? "up" : "down"}">${f.impact > 0 ? "▲ повышает" : "▼ понижает"}</span>
              <div class="bar-track"><div class="bar ${f.impact > 0 ? "up" : "down"}" data-w="${Math.max(8, Math.abs(f.impact) / maxImpact * 100)}" style="transition-delay:${.15 + i * .08}s"></div></div>
            </div>`).join("")}
        </div>
        ${listingCard(data)}`;
      result.style.display = "block";
      initListingCard(data);

      if (hasActual) countUp(document.getElementById("num-actual"), data.actual_price, " ₸");
      countUp(document.getElementById("num-fair"), data.fair_price, " ₸");
      requestAnimationFrame(() => requestAnimationFrame(() => {
        result.querySelectorAll(".bar").forEach(b => b.style.width = b.dataset.w + "%");
        if (hasActual) document.getElementById("needle").style.left = pos(data.actual_price) + "%";
      }));
    }

    /* ---------- вставка из буфера по клику на иконку ссылки ---------- */
    const pasteBtn = document.getElementById("paste-btn");
    pasteBtn.addEventListener("click", async () => {
      const input = document.getElementById("url");
      const iconWrap = pasteBtn.querySelector("[data-icon], .paste-icon");
      try {
        const text = (await navigator.clipboard.readText()).trim();
        if (text) {
          input.value = text;
          iconWrap.innerHTML = kfpIcon("check-circle", 22);
          pasteBtn.classList.add("ok");
          setTimeout(() => {
            iconWrap.innerHTML = kfpIcon("link", 22);
            pasteBtn.classList.remove("ok");
          }, 1300);
        }
      } catch (_) { /* буфер недоступен — просто фокус на поле */ }
      input.focus();
    });

    /* анимация смены текста на кнопке */
    const setBtnText = (t) => {
      const el = document.getElementById("btn-text");
      el.textContent = t;
      el.classList.remove("text-swap");
      void el.offsetWidth;
      el.classList.add("text-swap");
    };

    /* ---------- сабмит ---------- */
    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("btn"), btnText = document.getElementById("btn-text"),
            btnIcon = document.getElementById("btn-icon"),
            result = document.getElementById("result"), error = document.getElementById("error"),
            loading = document.getElementById("loading");
      result.style.display = "none";
      error.style.display = "none";
      loading.style.display = "block";
      btn.disabled = true;
      setBtnText("Думаю…");
      btnIcon.outerHTML = `<span id="btn-icon" class="spinner"></span>`;
      try {
        const resp = await fetch("/api/predict", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url: document.getElementById("url").value }),
        });
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.detail || "Что-то пошло не так");
        render(data);
      } catch (err) {
        error.textContent = err.message;
        error.style.display = "block";
      } finally {
        loading.style.display = "none";
        btn.disabled = false;
        setBtnText("Оценить");
        document.getElementById("btn-icon").outerHTML =
          `<span id="btn-icon">${kfpIcon("sparkles", 20)}</span>`;
      }
    });
  </script>
</body>
</html>
