name: Deploy to HF Space

on:
  push:
    branches: [main]
    # Состояние бота коммитится в приватный репо данных, а не сюда, — каждый
    # push в main теперь кодовый и пересобирает Space.
  workflow_dispatch:

concurrency:
  group: hf-deploy
  cancel-in-progress: true

permissions:
  contents: read
  actions: read # gate читает статус прогонов CI

jobs:
  # Деплой обгонял тесты: CI и этот воркфлоу стартуют от одного push
  # параллельно, без всякой связи между собой. Коммит с красными тестами
  # уезжал в прод и жил там до следующего пуша — CI краснел уже ПОСЛЕ выката.
  #
  # `needs:` между воркфлоу не работает, а переезд на workflow_run сломал бы
  # paths-ignore (ночные коммиты статистики пересобирали бы Space) и подменил
  # head_sha, по которому smoke.yml ищет ревизию. Поэтому ждём прогон CI по
  # ТОМУ ЖЕ коммиту через API и падаем, если он не зелёный.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Wait for CI on this commit
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          api="repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&per_page=20"
          for i in $(seq 1 100); do   # до ~33 минут: e2e-джоб CI сам по себе до 15
            info=$(gh api "$api" \
              --jq '[.workflow_runs[] | select(.event == "push")][0]
                    | "\(.status) \(.conclusion // "-")"' 2>/dev/null || echo "")
            case "$info" in
              ""|null*|" -")
                echo "попытка $i: прогон CI по ${GITHUB_SHA:0:8} ещё не заведён" ;;
              completed*)
                conclusion=${info#completed }
                if [ "$conclusion" = "success" ]; then
                  echo "CI зелёный — деплою"; exit 0
                fi
                echo "::error::CI по ${GITHUB_SHA:0:8} завершился как '$conclusion' — деплой отменён"
                exit 1 ;;
              *)
                echo "попытка $i: CI в статусе '$info'" ;;
            esac
            sleep 20
          done
          echo "::error::Не дождались CI по ${GITHUB_SHA:0:8} за 33 минуты — деплой отменён"
          exit 1

      - name: Manual dispatch skips the gate
        if: github.event_name != 'push'
        run: echo "Ручной запуск — гейт CI пропущен осознанно"

  deploy:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Push snapshot to Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # README для Space: метаданные + наш README
          { echo '---'
            echo 'title: Krisha Fair Price'
            echo 'emoji: 🏠'
            echo 'colorFrom: green'
            echo 'colorTo: blue'
            echo 'sdk: docker'
            echo 'app_port: 7860'
            echo 'pinned: true'
            echo '---'
            cat README.md; } > /tmp/README.md
          mv /tmp/README.md README.md
          # Ревизия, которую отдаёт /api/health: смоук после деплоя обязан
          # проверять, что прод поднялся именно на ЭТОМ коммите. Файл кладём в
          # data/ — Dockerfile копирует в образ только src/models/data/static,
          # файл в корне репозитория до контейнера не доехал бы.
          mkdir -p data && echo "$GITHUB_SHA" > data/build_revision.txt
          # свежий снапшот одним коммитом (без истории — файлы >10МБ уходят в LFS)
          rm -rf .git
          git init -b main
          git lfs track "data/*.db" "models/*.cbm" "*.png" "*.jpg" "*.ico"
          # Аудит безопасности 2026-10-06: Space — ПУБЛИЧНОЕ зеркало, а
          # `git add -A` отправлял в него весь чекаут (tests/, .kiro/,
          # scripts/, infra/, reports/ ...). Образу нужно ровно то, что
          # копирует Dockerfile (pyproject.toml, README.md,
          # requirements-runtime.lock, src, models, data, static) плюс сам
          # Dockerfile, .dockerignore и .gitattributes (его только что создал
          # `git lfs track`). Остальное наружу не едет. Список явный: новый
          # каталог в корне репозитория попадёт в публичный Space только если
          # его добавят сюда осознанно; несуществующий путь валит шаг (fatal),
          # а не уезжает молча сломанным снапшотом.
          # tests/test_workflows_hardening.py сверяет этот список с COPY из Dockerfile.
          git add Dockerfile README.md pyproject.toml requirements-runtime.lock \
            .dockerignore .gitattributes src models data static
          # -f: data/build_revision.txt в .gitignore (он генерится здесь и не
          # должен лежать в репозитории), но в снапшот для Space обязан попасть
          git add -f data/build_revision.txt
          git -c user.name=deploy -c user.email=deploy@local commit -m "deploy $GITHUB_SHA"
          # Токен — не в URL и не в argv: токен в `https://user:TOKEN@host` виден
          # в списке процессов раннера и в выводе git при сбое (remote URL
          # печатается в ошибках), а argv любой дочерней команды читается
          # соседними процессами. credential helper получает его из окружения
          # (HF_TOKEN унаследован от шага), в командной строке лежит лишь
          # литерал `$HF_TOKEN`, который раскрывает sh внутри самого helper'а.
          # Отвечаем только на `get` — на store/erase печатать пароль незачем.
          # git-lfs берёт учётку тем же путём (git credential fill).
          git -c credential.helper='!f() { test "$1" = get || exit 0; echo "username=Dex719"; echo "password=$HF_TOKEN"; }; f' \
            push --force https://huggingface.co/spaces/Dex719/krisha-fair-price main
