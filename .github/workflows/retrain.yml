name: Weekly retrain

on:
  schedule:
    - cron: "0 2 * * 0" # воскресенье 07:00 Алматы (UTC+5)
  workflow_dispatch:

concurrency:
  group: krisha-db-writes
  cancel-in-progress: false

permissions:
  contents: write
  actions: write # запуск deploy-hf после коммита модели (см. шаг Deploy)

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          pip install -r requirements-train.lock
          pip install -e . --no-deps

      - name: Download DB from release
        run: python -m krisha.db_release --require

      - name: Snapshot current metrics and model
        run: |
          cp models/model_meta.json /tmp/old_meta.json
          cp models/model.cbm /tmp/old_model.cbm || true

      - name: Train
        run: python scripts/train.py --compare-old /tmp/old_model.cbm

      - name: Metric gate (не деплоим, если стало хуже)
        id: gate
        run: python scripts/model_gate.py /tmp/old_meta.json models/model_meta.json --summary "$GITHUB_STEP_SUMMARY"

      - name: Отчёт о переобучении в Telegram
        if: always() && steps.gate.outcome != 'skipped'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_ADMIN_CHAT_ID: ${{ secrets.TG_ADMIN_CHAT_ID }}
        run: python scripts/notify_retrain.py /tmp/old_meta.json models/model_meta.json --gate ${{ steps.gate.outcome }}

      - name: Commit new model
        id: commit_model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/ reports/
          if git diff --cached --quiet; then
            echo "Модель не изменилась — коммитить нечего"
            echo "pushed=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "model: weekly retrain $(date -u +%F)"
          git pull --rebase origin main
          git push origin main
          echo "pushed=1" >> "$GITHUB_OUTPUT"

      - name: Deploy to Space
        # Пуш, сделанный GITHUB_TOKEN'ом, по правилам GitHub Actions НЕ триггерит
        # deploy-hf (анти-рекурсия) — из-за этого прод неделями работал на старой
        # модели, пока кто-нибудь не пушил в main руками (retrain 16.08 доехал бы
        # на Space только со следующим ручным коммитом). workflow_dispatch —
        # документированное исключение: дергаем деплой явно.
        if: steps.commit_model.outputs.pushed == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-hf.yml --ref main

      - name: Publish models release
        continue-on-error: true  # публикация вторична, пока есть коммит в main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FILES=$(python -c "from krisha.db_release import MODEL_ARTIFACT_PATHS as P; import os; print(' '.join(os.path.basename(str(x)) for x in P))")
          tar -czf /tmp/models.tar.gz -C models $FILES
          sha256sum /tmp/models.tar.gz | cut -d' ' -f1 > /tmp/models.tar.gz.sha256
          gh release upload model-latest /tmp/models.tar.gz /tmp/models.tar.gz.sha256 --clobber || \
            gh release create model-latest /tmp/models.tar.gz /tmp/models.tar.gz.sha256 \
              --title "model-latest" --notes "Актуальные веса модели (мутабельный релиз)"
          TAG="model-$(date -u +%F)"
          gh release create "$TAG" /tmp/models.tar.gz /tmp/models.tar.gz.sha256 \
            --title "$TAG" --notes "Снапшот моделей $(date -u +%F)"
