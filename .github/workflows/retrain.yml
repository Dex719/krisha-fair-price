name: Weekly retrain

on:
  schedule:
    - cron: "0 2 * * 0" # воскресенье 07:00 Алматы (UTC+5)
  workflow_dispatch:

concurrency:
  group: krisha-db-writes
  cancel-in-progress: false

permissions:
  contents: write # коммит меты, отчётов и README

# База и веса модели — в релизах приватного репозитория данных (issue #74:
# модели больше не коммитятся в git). Доступ — KRISHA_DB_TOKEN, см. rescrape.yml.
env:
  KRISHA_DATA_REPO: Dex719/krisha-db

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          pip install -r requirements-train.lock
          pip install -e . --no-deps

      - name: Download DB and current models
        env:
          KRISHA_DB_TOKEN: ${{ secrets.KRISHA_DB_TOKEN }}
        run: |
          python -m krisha.db_release --require
          # Текущая модель нужна гейту: новая сравнивается со старой на одном test
          python -m krisha.db_release --models --require

      - name: Snapshot current metrics and model
        run: |
          cp models/model_meta.json /tmp/old_meta.json
          cp models/model.cbm /tmp/old_model.cbm || true

      - name: Train
        run: python scripts/train.py --compare-old /tmp/old_model.cbm

      - name: Metric gate (не деплоим, если стало хуже)
        id: gate
        run: python scripts/model_gate.py /tmp/old_meta.json models/model_meta.json --summary "$GITHUB_STEP_SUMMARY"

      - name: Отчёт о переобучении в Telegram
        if: always() && steps.gate.outcome != 'skipped'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_ADMIN_CHAT_ID: ${{ secrets.TG_ADMIN_CHAT_ID }}
        run: python scripts/notify_retrain.py /tmp/old_meta.json models/model_meta.json --gate ${{ steps.gate.outcome }}

      # Артефакты больше не лежат в git, и CI их не видит (tests/test_model_artifacts.py
      # там скипается). Согласованность meta ↔ модель ↔ история проверяем здесь,
      # на свежеобученных файлах, — до того как они уйдут в прод.
      - name: Model artifact tests
        run: |
          pip install -c requirements-train.lock "pytest>=8.0"
          pytest -q tests/test_model_artifacts.py

      # Релиз — единственная копия весов, поэтому публикация критична и идёт
      # ДО коммита меты: упала публикация — README и мета в git не уезжают
      # вперёд модели, которую реально отдаёт прод.
      - name: Publish models release
        env:
          GH_TOKEN: ${{ secrets.KRISHA_DB_TOKEN }}
        run: |
          set -euo pipefail
          FILES=$(python -c "from krisha.db_release import MODEL_ARTIFACT_PATHS as P; import os; print(' '.join(os.path.basename(str(x)) for x in P))")
          tar -czf /tmp/models.tar.gz -C models $FILES
          sha256sum /tmp/models.tar.gz | cut -d' ' -f1 > /tmp/models.tar.gz.sha256
          gh release upload model-latest /tmp/models.tar.gz /tmp/models.tar.gz.sha256 --clobber --repo "$KRISHA_DATA_REPO" || \
            gh release create model-latest /tmp/models.tar.gz /tmp/models.tar.gz.sha256 --repo "$KRISHA_DATA_REPO" \
              --title "model-latest" --notes "Актуальные веса модели (мутабельный релиз)"
          TAG="model-$(date -u +%F)"
          # повторный ретрейн в тот же день перезаливает снапшот дня, а не падает
          gh release create "$TAG" /tmp/models.tar.gz /tmp/models.tar.gz.sha256 --repo "$KRISHA_DATA_REPO" \
            --title "$TAG" --notes "Снапшот моделей $(date -u +%F)" || \
            gh release upload "$TAG" /tmp/models.tar.gz /tmp/models.tar.gz.sha256 --clobber --repo "$KRISHA_DATA_REPO"

      # issue #190 §2.2: README генерируется из меты тем же коммитом, что и
      # мета — иначе блок метрик отставал на ретрейн (7.29% при мете 7.49%),
      # а тест проверял только маркеры. Теперь tests/test_readme.py гоняет
      # `--check`, и рассинхрон краснит CI.
      - name: Sync README metrics
        run: python scripts/sync_readme_metrics.py

      # В git едут только мета, история метрик, снапшот статистики, отчёты и
      # README; веса, spatial_ref и gate-сэмплы — в .gitignore (они в релизе).
      - name: Commit model metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/ reports/ README.md
          if git diff --cached --quiet; then
            echo "Мета не изменилась — коммитить нечего"
            exit 0
          fi
          git commit -m "model: weekly retrain $(date -u +%F)"
          git pull --rebase origin main
          git push origin main

      # Весов в образе Space нет: при старте он качает model-latest
      # (krisha.db_release.ensure_models). Передеплой не нужен — рестарта
      # достаточно, чтобы свежий контейнер подтянул новую модель.
      - name: Restart Space (подтянуть новую модель)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN не задан — пропускаю рестарт Space"
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $HF_TOKEN" \
            https://huggingface.co/api/spaces/Dex719/krisha-fair-price/restart
