name: Prod smoke

on:
  workflow_run:
    workflows: ["Deploy to HF Space"]
    types:
      - completed
  schedule:
    - cron: "17 3,15 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prod-smoke
  cancel-in-progress: false

jobs:
  smoke:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install smoke dependencies
        run: python -m pip install "httpx>=0.27"

      # Дожидаемся, пока HF ДОСТРОИТ новую ревизию. Без этого шага смоук
      # после деплоя бил по ещё работающему старому контейнеру: он честно
      # отвечает 200 всё время пересборки, так что прогон «подтверждал»
      # предыдущий деплой, а не текущий. Обычный опрос /api/health эту
      # разницу не видит — нужен именно sha ревизии.
      - name: Wait for the deployed revision
        if: github.event_name == 'workflow_run'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          WANT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -uo pipefail
          api=https://huggingface.co/api/spaces/Dex719/krisha-fair-price
          auth=()
          [ -n "${HF_TOKEN:-}" ] && auth=(-H "Authorization: Bearer $HF_TOKEN")
          for i in $(seq 1 60); do   # до ~10 минут
            body=$(curl -fsS "${auth[@]}" "$api" || echo '{}')
            stage=$(echo "$body" | jq -r '.runtime.stage // "UNKNOWN"')
            sha=$(echo "$body" | jq -r '.sha // ""')
            echo "попытка $i: stage=$stage sha=${sha:0:8} ждём=${WANT_SHA:0:8}"
            if [ "$stage" = "RUNNING" ] && { [ -z "$sha" ] || [ "$sha" = "$WANT_SHA" ]; }; then
              echo "Space поднят на нужной ревизии"; exit 0
            fi
            sleep 10
          done
          echo "::warning::Не дождались нужной ревизии — смоук пойдёт по тому, что есть"

      - name: Run prod smoke
        run: python scripts/smoke_prod.py

      - name: Notify Telegram on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_ADMIN_CHAT_ID: ${{ secrets.TG_ADMIN_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TG_ADMIN_CHAT_ID" ]; then
            echo "TELEGRAM_BOT_TOKEN or TG_ADMIN_CHAT_ID is not set; skip Telegram notification"
            exit 0
          fi

          text="🚨 baǵam prod smoke failed
          Repo: ${GITHUB_REPOSITORY}
          Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TG_ADMIN_CHAT_ID}" \
            --data-urlencode "text=${text}"
