name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests scripts
      - name: Tests
        run: pytest -q
      - name: Audit dependencies (pip-audit)
        continue-on-error: true
        run: |
          pip install -q pip-audit
          pip-audit --skip-editable

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Install Chromium
        # Без --with-deps: системные библиотеки Chromium на образах
        # ubuntu-latest уже стоят, а apt-шаг --with-deps подвисал на зеркалах
        # (первый прогон простоял 13+ минут). Если раннер однажды обеднеет,
        # Playwright упадёт с внятным списком недостающих библиотек.
        run: playwright install chromium
      - name: Browser e2e (герметичные — без базы и внешней сети)
        run: pytest -m e2e -q
