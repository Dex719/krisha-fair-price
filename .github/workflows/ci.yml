name: CI

on:
  push:
    branches: [main]
    # issue #190 §2.5: state-коммиты рантайма Space (статистика, подписки,
    # лог предиктов) прилетают 3–4 раза в день и гоняли полный CI + e2e на
    # каждый — кода они не меняют. Список тот же, что в deploy-hf.yml.
    paths-ignore:
      - "data/subscriptions.json"
      - "data/tracked.json"
      - "data/usage_stats.json"
      - "data/channel_posted.json"
      - "data/prediction_log.json"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      # Ставим ровно те версии, что едут на прод (lock), а не свежие из pyproject:
      # иначе CI зеленеет на starlette 1.7, пока прод крутит 1.3.1 — так
      # неделю прятался прод-баг статики (.kiro/specs/ci-uses-lock).
      # requirements-train.lock = всё из requirements.lock + обучение; сверху —
      # только инструменты разработки, прижатые тем же lock через -c.
      - name: Install
        run: |
          pip install -r requirements-train.lock
          pip install -e . --no-deps
          pip install -c requirements-train.lock "pytest>=8.0" "ruff>=0.4" "pytest-playwright>=0.5"
      - name: Lint
        run: ruff check src tests scripts
      - name: Tests
        run: pytest -q
      # issue #190 §2.5: аудит блокирует, а не «жёлтый навсегда» — с
      # continue-on-error PYSEC-2026-3552 (cryptography 49.0.0) висел в логах
      # неделями, и никто его не видел. Временные исключения — только через
      # `--ignore-vuln ID` с комментарием и датой снятия рядом.
      - name: Audit dependencies (pip-audit)
        run: |
          pip install -q pip-audit
          # Аудитим lock, который реально ставим в образ, а не окружение раннера:
          # предустановленный setuptools ubuntu-latest (PYSEC-2026-3447) — не наша зависимость.
          pip-audit -r requirements.lock --no-deps

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      # Ставим ровно те версии, что едут на прод (lock), а не свежие из pyproject:
      # иначе CI зеленеет на starlette 1.7, пока прод крутит 1.3.1 — так
      # неделю прятался прод-баг статики (.kiro/specs/ci-uses-lock).
      # requirements-train.lock = всё из requirements.lock + обучение; сверху —
      # только инструменты разработки, прижатые тем же lock через -c.
      - name: Install
        run: |
          pip install -r requirements-train.lock
          pip install -e . --no-deps
          pip install -c requirements-train.lock "pytest>=8.0" "ruff>=0.4" "pytest-playwright>=0.5"
      - name: Install Chromium
        # Без --with-deps: системные библиотеки Chromium на образах
        # ubuntu-latest уже стоят, а apt-шаг --with-deps подвисал на зеркалах
        # (первый прогон простоял 13+ минут). Если раннер однажды обеднеет,
        # Playwright упадёт с внятным списком недостающих библиотек.
        run: playwright install chromium
      - name: Browser e2e (герметичные — без базы и внешней сети)
        run: pytest -m e2e -q
