name: Daily rent rescrape

on:
  schedule:
    - cron: "0 15 * * *" # 20:00 Алматы (UTC+5) — вечером, чтобы не пересекаться с утренним проходом продажи (бан по IP)
  workflow_dispatch:
    inputs:
      pages:
        description: "Максимум страниц выдачи на один шард (район × комнаты)"
        default: "250"
      max_new:
        description: "Максимум новых детальных страниц"
        default: "1000"

concurrency:
  group: krisha-rent-db-writes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  rescrape-rent:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.lock
          pip install -e . --no-deps

      - name: Download rent DB from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Раньше здесь стояло `download && gunzip || echo "базы ещё нет"`,
          # и `||` глотал ЛЮБУЮ ошибку — сетевой сбой, битый gzip, урезанную
          # закачку. Проход стартовал с пустой базой, находил «все объявления
          # новыми» и заливал этот огрызок обратно в db-latest поверх
          # накопленной истории. Отличаем «ассета нет» (нормально для первого
          # запуска) от «скачать не удалось» (падаем).
          if gh release view db-latest --json assets -q '.assets[].name' \
               | grep -qx 'krisha_rent.db.gz'; then
            gh release download db-latest -p krisha_rent.db.gz -O /tmp/krisha_rent.db.gz
            if gh release view db-latest --json assets -q '.assets[].name' \
                 | grep -qx 'krisha_rent.db.gz.sha256'; then
              gh release download db-latest -p krisha_rent.db.gz.sha256 -O /tmp/rent.sha256
              echo "$(cat /tmp/rent.sha256)  /tmp/krisha_rent.db.gz" | sha256sum -c -
            fi
            gunzip -c /tmp/krisha_rent.db.gz > data/krisha_rent.db
          else
            echo "Арендной базы в релизе ещё нет — начинаем с нуля"
          fi

      - name: Rescrape rent
        env:
          KRISHA_DELAY_MIN: "2.5"
          KRISHA_DELAY_MAX: "5.0"
        run: |
          python scripts/rescrape.py \
            --deal arenda \
            --pages "${{ github.event.inputs.pages || '250' }}" \
            --max-new "${{ github.event.inputs.max_new || '1000' }}" \
            --fail-empty \
            --summary-json /tmp/rescrape_rent_stats.json

      - name: Job summary
        if: always()
        run: |
          if [ -f /tmp/rescrape_rent_stats.json ]; then
            {
              echo "### Рескрейп аренды $(date -u +%F)"
              echo '```json'
              cat /tmp/rescrape_rent_stats.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload rent DB to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sqlite3 data/krisha_rent.db "VACUUM;" || true
          gzip -9 -c data/krisha_rent.db > /tmp/krisha_rent.db.gz
          sha256sum /tmp/krisha_rent.db.gz | cut -d' ' -f1 > /tmp/krisha_rent.db.gz.sha256
          gh release upload db-latest /tmp/krisha_rent.db.gz /tmp/krisha_rent.db.gz.sha256 --clobber
          echo "Размер арендной базы в релизе: $(du -h /tmp/krisha_rent.db.gz | cut -f1)" >> "$GITHUB_STEP_SUMMARY"

      - name: Snapshot release
        continue-on-error: true  # архив вторичен — не красит ран
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/publish_snapshot.py \
            --db-gz /tmp/krisha_rent.db.gz --sha256 /tmp/krisha_rent.db.gz.sha256 \
            --asset-name krisha_rent.db.gz --stats-json /tmp/rescrape_rent_stats.json \
            --label "Аренда" --rotate-keep-days 0
