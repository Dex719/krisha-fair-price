name: Space keep-alive

on:
  schedule:
    - cron: "30 */6 * * *"
  workflow_dispatch:
    inputs:
      restart:
        description: "Рестартнуть Space (иначе только пинг)"
        default: "false"

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Restart Space (по ручному запросу)
        if: github.event.inputs.restart == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $HF_TOKEN" \
            https://huggingface.co/api/spaces/Dex719/krisha-fair-price/restart
          echo "Рестарт запрошен, жду минуту перед проверкой"
          sleep 60

      # Состояние прошлой проверки живёт между запусками: скрипт шлёт алерт
      # только на СМЕНУ состояния (упал / ожил / деградировал), а не 4 раза в
      # сутки. Без кэша каждый запуск выглядел бы как первый.
      - name: Restore previous health state
        uses: actions/cache/restore@v6
        with:
          path: health_state.json
          key: health-state-${{ github.run_id }}
          restore-keys: health-state-

      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Скрипт нарочно на голом stdlib: ставить зависимости проекта ради
      # одного HTTP-запроса — это несколько минут catboost на каждый прогон.
      - name: Health check + alert on state change
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_ADMIN_CHAT_ID: ${{ secrets.TG_ADMIN_CHAT_ID }}
        run: python scripts/health_check.py --state-file health_state.json

      - name: Save health state
        if: always()
        uses: actions/cache/save@v6
        with:
          path: health_state.json
          key: health-state-${{ github.run_id }}
