name: Probe map filters
on:
  push:
    branches: [probe/map-filters]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: python3 .github/probe/m.py
      - uses: actions/upload-artifact@v4
        with:
          name: card
          path: /tmp/card.html
