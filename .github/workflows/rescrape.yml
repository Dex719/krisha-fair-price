name: Daily rescrape

on:
  schedule:
    - cron: "0 1 * * *" # 06:00 Алматы (UTC+5)
  workflow_dispatch:
    inputs:
      pages:
        description: "Максимум страниц выдачи на один шард (район × комнаты)"
        default: "250"
      max_new:
        description: "Максимум новых детальных страниц (пусто — из режима: drain 4500 / steady 1500)"
        default: ""
      time_budget_min:
        description: "Мягкий дедлайн прохода, мин (меньше timeout-minutes — успеть залить базу)"
        default: "320"
      delay_min:
        description: "Минимальная пауза между запросами, сек (пусто — из режима: drain 1.5 / steady 2.0)"
        default: ""
      delay_max:
        description: "Максимальная пауза между запросами, сек (пусто — из режима: drain 3.0 / steady 4.0)"
        default: ""

concurrency:
  group: krisha-db-writes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  rescrape:
    runs-on: ubuntu-latest
    # Полный шардированный проход (~44к объявлений, ~2200 страниц выдачи)
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.lock
          pip install -e . --no-deps

      - name: Download DB from release
        run: python -m krisha.db_release --require

      - name: Rescrape
        env:
          # issue #190 §2.3 (ревью 02.09). Режим прохода (#152) выбирается
          # кодом по backlog'у: drain = 4500 деталей при паузах 1.5–3.0 с,
          # steady = 1500 при 2.0–4.0. Но воркфлоу подставлял `|| '2.5'`,
          # `|| '5.0'` и `--max-new 1000` ВСЕГДА — явные значения побеждают
          # пресет, и drain по факту не наступал ни разу: sweep_runs пишет
          # mode=drain при max_new_effective=1000 и паузах 2.5–5.0 каждый
          # день, очередь 23–30k не тает. Пустой input = «используй пресет»
          # (config._env_float и sweep() читают пустую строку как «не задано»).
          # Потолок под бюджет времени урезает fit_detail_caps, откат пауз
          # при бане — pass_plan.BAN_ROLLBACK_STREAK.
          KRISHA_DELAY_MIN: "${{ github.event.inputs.delay_min }}"
          KRISHA_DELAY_MAX: "${{ github.event.inputs.delay_max }}"
        run: |
          python scripts/rescrape.py \
            --pages "${{ github.event.inputs.pages || '250' }}" \
            ${{ github.event.inputs.max_new && format('--max-new {0}', github.event.inputs.max_new) || '' }} \
            --time-budget-min "${{ github.event.inputs.time_budget_min || '320' }}" \
            --fail-empty \
            --fail-below 8000 \
            --summary-json /tmp/rescrape_stats.json

      - name: Job summary
        if: always()
        run: |
          if [ -f /tmp/rescrape_stats.json ]; then
            {
              echo "### Рескрейп $(date -u +%F)"
              echo '```json'
              cat /tmp/rescrape_stats.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Критический путь — сразу после сбора (.kiro/specs/rescrape-post-steps).
      # Раньше заливка ждала шаг Alerts, а тот без своего потолка разросся до
      # 80 минут: 2026-09-20 джоба умерла по timeout-minutes на алертах, и
      # 4 ч 43 мин собранных данных так и не доехали до прода.
      - name: Upload DB to release
        id: upload_db
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sqlite3 data/krisha.db "VACUUM;" || true
          gzip -9 -c data/krisha.db > /tmp/krisha.db.gz
          # Контрольная сумма рядом с базой: db_release проверяет её при скачивании
          sha256sum /tmp/krisha.db.gz | cut -d' ' -f1 > /tmp/krisha.db.gz.sha256
          gh release upload db-latest /tmp/krisha.db.gz /tmp/krisha.db.gz.sha256 --clobber
          echo "Размер базы в релизе: $(du -h /tmp/krisha.db.gz | cut -f1)" >> "$GITHUB_STEP_SUMMARY"

      - name: Restart Space (подтянуть свежую базу)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN не задан — пропускаю рестарт Space"
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $HF_TOKEN" \
            https://huggingface.co/api/spaces/Dex719/krisha-fair-price/restart

      - name: Snapshot release
        continue-on-error: true  # архив вторичен — не красит ран
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/publish_snapshot.py \
            --db-gz /tmp/krisha.db.gz --sha256 /tmp/krisha.db.gz.sha256 \
            --asset-name krisha.db.gz --stats-json /tmp/rescrape_stats.json \
            --label "Продажа" --rotate-keep-days 14

      # always(): утренний отчёт админу нужнее всего как раз когда проход упал.
      # Свой потолок: база уже в релизе, и вторичный шаг больше не может
      # съесть бюджет джобы (320 + ~3 + 15 + ~2 ≈ 340 < 350 мин).
      - name: Alerts
        id: alerts
        if: always()
        continue-on-error: true
        timeout-minutes: 15
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TG_CHANNEL_ID: ${{ secrets.TG_CHANNEL_ID }}
          TG_ADMIN_CHAT_ID: ${{ secrets.TG_ADMIN_CHAT_ID }}
        run: python scripts/send_alerts.py

      # Алерты пишут вердикты окна в predictions (issue #128) — заливаем базу
      # ещё раз, чтобы они не пропали. Только если проход удался (первая
      # заливка была) и алерты дошли до конца; иначе в релизе остаётся база
      # первой заливки — собранное не теряется в любом случае.
      - name: Upload DB again (вердикты алертов)
        if: steps.upload_db.outcome == 'success' && steps.alerts.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sqlite3 data/krisha.db "VACUUM;" || true
          gzip -9 -c data/krisha.db > /tmp/krisha.db.gz
          sha256sum /tmp/krisha.db.gz | cut -d' ' -f1 > /tmp/krisha.db.gz.sha256
          gh release upload db-latest /tmp/krisha.db.gz /tmp/krisha.db.gz.sha256 --clobber
