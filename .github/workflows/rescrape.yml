name: Daily rescrape

on:
  schedule:
    - cron: "0 1 * * *" # 06:00 Алматы (UTC+5)
  workflow_dispatch:
    inputs:
      pages:
        description: "Максимум страниц выдачи"
        default: "400"
      max_new:
        description: "Максимум новых детальных страниц"
        default: "300"

concurrency:
  group: krisha-db-writes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  rescrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Download DB from release
        run: python -m krisha.db_release --require

      - name: Rescrape
        env:
          # Не спешим: щадящие задержки, чтобы не злить krisha.kz
          KRISHA_DELAY_MIN: "2.5"
          KRISHA_DELAY_MAX: "5.0"
        run: |
          python scripts/rescrape.py \
            --pages "${{ github.event.inputs.pages || '400' }}" \
            --max-new "${{ github.event.inputs.max_new || '300' }}" \
            --fail-empty \
            --summary-json /tmp/rescrape_stats.json

      - name: Job summary
        if: always()
        run: |
          if [ -f /tmp/rescrape_stats.json ]; then
            {
              echo "### Рескрейп $(date -u +%F)"
              echo '```json'
              cat /tmp/rescrape_stats.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload DB to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sqlite3 data/krisha.db "VACUUM;" || true
          gzip -9 -c data/krisha.db > /tmp/krisha.db.gz
          gh release upload db-latest /tmp/krisha.db.gz --clobber
          echo "Размер базы в релизе: $(du -h /tmp/krisha.db.gz | cut -f1)" >> "$GITHUB_STEP_SUMMARY"

      - name: Alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python scripts/send_alerts.py
