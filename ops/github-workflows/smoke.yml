name: Prod smoke

on:
  workflow_run:
    workflows: ["Deploy to HF Space"]
    types:
      - completed
  schedule:
    - cron: "17 3,15 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prod-smoke
  cancel-in-progress: false

jobs:
  smoke:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install smoke dependencies
        run: python -m pip install "httpx>=0.27"

      # Дожидаемся, пока прод ПОДНИМЕТСЯ на выкаченном коммите. Без этого шага
      # смоук после деплоя бил по ещё работающему старому контейнеру: он честно
      # отвечает 200 всё время пересборки, так что прогон «подтверждал»
      # предыдущий деплой, а не текущий.
      #
      # Спрашиваем сам сервис (/api/health.revision, файл кладёт deploy-hf.yml),
      # а не метаданные HF: при пуше снапшота Space получает СВОЙ коммит, и
      # `.sha` из API HF не совпадал с нашим никогда — прежняя проверка ждала
      # заведомо невозможного совпадения и каждый раз уходила в warning.
      #
      # Не дождались — падаем. Смоук, который «на всякий случай» проверяет
      # старую ревизию, это не проверка, а зелёная галочка ни о чём.
      - name: Wait for the deployed revision
        if: github.event_name == 'workflow_run'
        env:
          WANT_SHA: ${{ github.event.workflow_run.head_sha }}
          BASE_URL: ${{ vars.PROD_BASE_URL || 'https://dex719-krisha-fair-price.hf.space' }}
        run: |
          set -uo pipefail
          for i in $(seq 1 90); do   # до ~15 минут: пересборка образа на HF
            got=$(curl -fsS -m 20 "$BASE_URL/api/health" 2>/dev/null | jq -r '.revision // ""' || echo "")
            echo "попытка $i: revision=${got:0:8} ждём=${WANT_SHA:0:8}"
            if [ "$got" = "$WANT_SHA" ]; then
              echo "Прод поднят на выкаченной ревизии"; exit 0
            fi
            sleep 10
          done
          echo "::error::Прод не поднялся на ревизии ${WANT_SHA:0:8} за 15 минут — деплой НЕ подтверждён"
          exit 1

      - name: Run prod smoke
        run: python scripts/smoke_prod.py

      - name: Notify Telegram on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_ADMIN_CHAT_ID: ${{ secrets.TG_ADMIN_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TG_ADMIN_CHAT_ID" ]; then
            echo "TELEGRAM_BOT_TOKEN or TG_ADMIN_CHAT_ID is not set; skip Telegram notification"
            exit 0
          fi

          text="🚨 baǵam prod smoke failed
          Repo: ${GITHUB_REPOSITORY}
          Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TG_ADMIN_CHAT_ID}" \
            --data-urlencode "text=${text}"
